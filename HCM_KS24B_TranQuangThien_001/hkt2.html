<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./hkt2.css">
   
       
</head>

<body>
    <h1>Quản Lý Sinh Viên</h1>
    <div class="container">
        <input type="text" id="name" placeholder="Họ và tên" />
        <div class="error" id="nameError"></div>

        <input type="text" id="mssv" placeholder="Mã số sinh viên" />
        <div class="error" id="mssvError"></div>

        <input type="email" id="email" placeholder="Email" />
        <div class="error" id="emailError"></div>

        <input type="text" id="lop" placeholder="Lớp" />
        <div class="error" id="lopError"></div>

        <button class="btn" onclick="themHoacCapNhat()" id="submitBtn">Thêm sinh viên</button>
    </div>

    <div class="table-container">
        <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên..." oninput="hienThiDanhSach()" />
        
        <table>
            <thead>
                <tr>
                    <th>Họ tên</th>
                    <th>MSSV</th>
                    <th>Email</th>
                    <th>Lớp</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="studentList"></tbody>
        </table>
    </div>
<script src="./hkt2.js"></script>
   
</body>

</html>
